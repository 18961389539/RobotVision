# RobotVision 自动构建与测试
# 触发:push / PR 到 main 分支,在 Windows runner 上还原 → 编译 → 跑全部测试。
# 说明:
# - 本项目无 Windows 打包(WAP)项目,不需要签名/MSIX 步骤;
# - 硬件冒烟(RV_HARDWARE_TEST)与 UI 冒烟(RV_UI_TEST)默认关闭,CI 自动跳过;
# - models/*.onnx 不入库(gitignore),依赖真实模型的用例检测文件缺失自动跳过。

name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore RobotVision.sln

    - name: Build (Release)
      run: dotnet build RobotVision.sln -c Release --no-restore --nologo

    - name: Test (Release)
      # 全量单元 + 集成测试;UI/硬件冒烟因环境变量未设置自动跳过
      run: dotnet test RobotVision.sln -c Release --no-build --no-restore --nologo
