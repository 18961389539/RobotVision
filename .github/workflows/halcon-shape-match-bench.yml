# HALCON shape_match 对标（无需 HALCON 运行时）
# 验证合成矩阵 P90、RV 基线 CSV、committed 一致性。
# engine side-by-side 在缺少 shape_match_halcon_results.csv 时自动 Skip。

name: HALCON Shape Match Bench

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shape-match-bench:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: 'Directory.Packages.props'

    - name: Restore
      run: dotnet restore tests/RobotVision.Tests/RobotVision.Tests.csproj

    - name: Shape match bench (matrix + RV baseline + MaskShapeMatch regression)
      run: dotnet test tests/RobotVision.Tests/RobotVision.Tests.csproj -c Release --no-restore --nologo --filter "FullyQualifiedName~Bench_shape_match|FullyQualifiedName~MaskShapeMatch|FullyQualifiedName~PrecisionBaseline.ShapeMatch"

    - name: Upload shape_match RV baseline artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shape-match-rv-baseline
        path: benchmarks/halcon/results/shape_match_robotvision_results.csv
        if-no-files-found: warn
