# HALCON rectangle2 对标（无需 HALCON 运行时）
# 验证 truth_gaps P90、合成夹具完整性、已提交 robotvision_results.csv 与引擎一致。
# engine side-by-side 在缺少 halcon_results.csv 时自动 Skip。

name: HALCON Rectangle2 Bench

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rv-truth-gaps:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: 'Directory.Packages.props'

    - name: Restore
      run: dotnet restore tests/RobotVision.Tests/RobotVision.Tests.csproj

    - name: HALCON rectangle2 bench (RV vs synthetic truth)
      run: dotnet test tests/RobotVision.Tests/RobotVision.Tests.csproj -c Release --no-restore --nologo --filter "FullyQualifiedName~Bench_halcon_|FullyQualifiedName~Bench_standard_subpixel"

    - name: Upload truth_gaps artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: halcon-truth-gaps
        path: |
          benchmarks/halcon/results/truth_gaps.csv
          benchmarks/halcon/results/truth_gaps_halcon_clip0.csv
        if-no-files-found: warn
