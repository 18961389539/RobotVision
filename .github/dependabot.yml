# Dependabot 依赖自动更新
# - NuGet:每周检查依赖新版本,批量开 PR(OpenCvSharp 等分组合并,减少噪音);
# - GitHub Actions:工作流文件本身也自动更新。
# 漏洞告警(vulnerability alerts)已通过 Settings 独立启用,与这里的版本更新互补。

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      opencv:
        patterns:
          - "OpenCvSharp*"
      test-frameworks:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "FsCheck*"
          - "Microsoft.NET.Test.Sdk"
      logging:
        patterns:
          - "Serilog*"
          - "Microsoft.Extensions.Logging*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
